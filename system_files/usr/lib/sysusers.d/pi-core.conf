# The core user, declared the way bootc wants it: a plain /etc/passwd entry with
# no sysusers.d counterpart trips `bootc container lint`, and on a bootc system
# sysusers.d is what reconciles users across image updates.
#
# Ignition created this account on the old installer image. A pre-rebased image
# has no Ignition, so it has to come from here.
# Groups match what Ignition gave the core user on Fedora CoreOS, verified on a
# running Pi: adm and systemd-journal are what let it read the journal without
# sudo, which matters on a machine whose first-boot problems live there.
u core 1000 "pi-core" /var/home/core /bin/bash
m core wheel
m core sudo
m core docker
m core adm
m core systemd-journal
