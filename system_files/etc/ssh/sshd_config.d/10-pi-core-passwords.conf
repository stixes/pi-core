# pi-core: allow SSH password logins.
#
# Fedora CoreOS ships 40-disable-passwords.conf with "PasswordAuthentication
# no". sshd takes the FIRST value obtained for a keyword, and sshd_config.d is
# read in lexical order, so this file must sort BEFORE 40- to win. Renaming it
# to sort after would silently do nothing.
#
# This is deliberate and it is the reason the published image ships a default
# password: a headless first login has to be possible with nothing but the IP.
# It also means the default credentials are reachable from the network — see
# docs/design-decisions.md, "Default credentials on the published image".
PasswordAuthentication yes
