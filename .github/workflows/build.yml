---
name: Build pi-core

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']          # a tag is what cuts a release; without this it is inert
    paths-ignore: ['**/*.md', 'docs/**']
  schedule:
    - cron: '30 5 * * *'   # daily, after uCore's own builds land
  workflow_dispatch:
    inputs:
      publish_image:
        description: 'Also build the flashable .img and publish it as a release'
        type: boolean
        default: false

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: pi-core
  DEFAULT_TAG: stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push (aarch64)
    # Native arm64 runner — free for public repos. Do NOT switch this to
    # ubuntu-24.04 without adding qemu-user-static; the build asserts aarch64.
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load build parameters
        # $GITHUB_ENV accepts only bare KEY=value lines, so strip comments
        # and blanks rather than cat'ing the file wholesale.
        run: |
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' pi-core.env >> "$GITHUB_ENV"
          # Owner is derived, never committed, so forks publish and verify
          # their own image.
          echo "REPO_ORGANIZATION=${{ github.repository_owner }}" >> "$GITHUB_ENV"

      - name: Choose the published tag
        # A version tag publishes :stable, which is what flashed cards track and
        # what the flashable image is built from. Everything else -- main,
        # the nightly rebuild, a manual run -- publishes :testing, so :stable
        # stays exactly some release until a tag moves it deliberately.
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "PUBLISH_TAG=${DEFAULT_TAG}" >> "$GITHUB_ENV"
          else
              echo "PUBLISH_TAG=${TESTING_TAG}" >> "$GITHUB_ENV"
          fi

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Tier 0 - static checks
        run: just test-static

      - name: Build image
        run: |
          podman build \
            --platform=linux/arm64 \
            --build-arg BASE_IMAGE="${BASE_IMAGE}" \
            --build-arg BASE_TAG="${BASE_TAG}" \
            --build-arg FEDORA_RELEASE="${FEDORA_RELEASE}" \
            --build-arg REPO_ORGANIZATION="${REPO_ORGANIZATION}" \
            --build-arg PI_CORE_VERSION="$(git describe --tags --always 2>/dev/null || echo unknown)" \
            -t "${IMAGE_NAME}:${DEFAULT_TAG}" .

      - name: Tier 1 - image assertions
        run: just test-image

      - name: Lowercase registry
        run: echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        # Deliberately the docker action rather than `podman login`: podman
        # writes $XDG_RUNTIME_DIR/containers/auth.json, which cosign does not
        # read, so signing failed with UNAUTHORIZED. This writes
        # ~/.docker/config.json, which cosign uses and podman falls back to,
        # so one login serves both the push and the signature.
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        id: push
        run: |
          podman push --digestfile=/tmp/digest \
            "${IMAGE_NAME}:${DEFAULT_TAG}" \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${PUBLISH_TAG}"
          echo "digest=$(< /tmp/digest)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        # Installer v4 + cosign v3.1.2 is a matched pair, and the pairing is
        # load-bearing in both directions: cosign 2.x lacks the
        # --new-bundle-format / --use-signing-config flags used below, while
        # installer v3 cannot verify a 3.x release (3.x ships .sigstore.json
        # bundles, v3 of the installer looks for a detached .sig).
        # NB: this action publishes no floating v4 tag (only v3 and exact
        # v4.x.y), so pin the SHA. This one is v4.1.2.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: 'v3.1.2'

      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          # The key is encrypted with an empty passphrase; cosign still needs
          # to be told, or it tries to prompt and fails on a runner.
          COSIGN_PASSWORD: ""
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # Old bundle format: rpm-ostree/containers-policy cannot read the new
          # one yet (containers/container-libs#388, rpm-ostree#5509).
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Tier 1.5 - verify the published image
        if: github.event_name != 'pull_request'
        # Proves the signature actually verifies and that the package can be
        # pulled with no credentials, which is what the Pi does on first boot.
        run: just test-supply-chain
        env:
          VERIFY_TAG: ${{ env.PUBLISH_TAG }}

  release-image:
    name: Publish flashable image
    # Not on every push, and never on the nightly schedule: the asset is ~800 MB.
    # Tag a release (v*), or tick publish_image on a manual run. A bare manual
    # run builds and tests without publishing, which is what `just ci` uses to
    # check a branch on a native arm64 runner.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_image
    needs: build
    # Must be arm64 now: `bootc install` executes the target image's own bootc
    # binary, so this is no longer just copying bytes around. Native beats
    # binfmt here -- the install does real filesystem work.
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: write   # create the release and upload assets to it
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load build parameters
        run: |
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' pi-core.env >> "$GITHUB_ENV"
          echo "REPO_ORGANIZATION=${{ github.repository_owner }}" >> "$GITHUB_ENV"

      - name: Install host prerequisites
        # rsync, xz, jq and fdisk are usually present but are not guaranteed
        # across runner image revisions, and this job is too slow to rediscover
        # that. rpm and cpio are no longer needed: the firmware comes out of the
        # image with `podman cp` rather than from extracted RPMs.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            rsync xz-utils jq fdisk

      - name: Show the tools this job depends on
        # One line of evidence beats another five-minute round trip.
        run: |
          for c in losetup sfdisk partprobe rsync xz jq truncate numfmt; do
            printf '%-10s %s\n' "$c" "$(command -v "$c" || echo MISSING)"
          done

      - name: Build the flashable image
        # From the tag this run published, so a manual publish_image run makes
        # an image of what it just built rather than of the last release.
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then TAG="${DEFAULT_TAG}"; else TAG="${TESTING_TAG}"; fi
          IMAGE="ghcr.io/${REPO_ORGANIZATION}/${IMAGE_NAME}:${TAG}" ./scripts/build-image.sh

      - name: Checksum
        run: |
          cd build
          sha256sum pi-core-*.img.xz > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: 'v3.1.2'

      - name: Sign the checksum file
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        # Sign SHA256SUMS rather than the image: one signature covers the
        # digest, and verifying it does not mean re-downloading 800 MB.
        # Same flag pairing as the image signing above — --tlog-upload aside,
        # --use-signing-config=false is required or cosign rejects the rest.
        run: |
          cosign sign-blob -y \
            --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            --output-signature build/SHA256SUMS.sig \
            build/SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              TAG="${GITHUB_REF#refs/tags/}"
          else
              TAG="image-$(date +%Y%m%d-%H%M)"
          fi
          # Anything below v1, or carrying -rc, is a prerelease.
          PRE=""
          case "$TAG" in
              v0.*|*-rc*|image-*) PRE="--prerelease" ;;
          esac
          # Notes are the annotated tag's message, read from the API rather than
          # left to `gh --notes-from-tag`: that flag silently fell back to the
          # commit message twice, even with the tag object present and fetched.
          # A static notes file is not an option either -- it turns into a
          # manual, and the manual is in README.md and INSTALL.md.
          NOTES_FILE=/tmp/release-notes.md
          : > "$NOTES_FILE"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              OBJ=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" --jq '.object.sha // empty' 2>/dev/null || true)
              TYPE=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" --jq '.object.type // empty' 2>/dev/null || true)
              # A lightweight tag has no message; only an annotated one does.
              if [[ "$TYPE" == "tag" && -n "$OBJ" ]]; then
                  gh api "repos/${GITHUB_REPOSITORY}/git/tags/${OBJ}" --jq '.message' > "$NOTES_FILE" 2>/dev/null || true
              fi
          fi
          if [[ -s "$NOTES_FILE" ]]; then
              NOTES=(--notes-file "$NOTES_FILE")
          else
              NOTES=(--generate-notes)
          fi
          # shellcheck disable=SC2086
          gh release create "$TAG" $PRE "${NOTES[@]}" --title "pi-core $TAG"
          gh release upload "$TAG" --clobber \
              build/pi-core-*.img.xz \
              build/SHA256SUMS \
              build/SHA256SUMS.sig
